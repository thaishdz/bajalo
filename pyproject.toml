[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bajalo"
version = "0.1.0"
description = "Download videos and audio from the terminal with a CLI or a TUI, powered by yt-dlp"
requires-python = ">=3.10"
dependencies = ["yt-dlp", "questionary", "textual"]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[project.scripts]
bajalo = "bajalo.cli:main"
bj = "bajalo.cli:main"
bajalo-tui = "bajalo.tui:main"
bjt = "bajalo.tui:main"
